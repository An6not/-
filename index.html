<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>fffaa 3D P2P</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
</head>
<body>
    <main id="mainMenu" class="menu">
        <div class="menu-content">
            <h1>fffaa 3D</h1>
            <p class="subtitle">P2P-поле от первого лица с кодом на 5 цифр</p>

            <div class="quality-selector">
                <p class="label">Графика:</p>
                <div class="quality-buttons">
                    <button id="qualityMin" class="quality-btn">Минимум</button>
                    <button id="qualityLow" class="quality-btn">Низкие</button>
                    <button id="qualityMed" class="quality-btn">Средние</button>
                    <button id="qualityUltra" class="quality-btn">Ультра</button>
                </div>
            </div>
            
            <button id="autoQualityBtn" class="auto-btn">Авто-настройка (60 FPS)</button>

            <div class="menu-buttons">
                <button id="soloBtn" class="primary">Играть одному</button>
                <button id="createRoomBtn">Создать комнату</button>
                <button id="joinRoomBtn">Подключиться</button>
            </div>

            <section id="joinRoomSection" class="panel hidden">
                <input id="roomCodeInput" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="12345" autocomplete="off">
                <button id="joinBtn" class="primary">Войти по коду</button>
            </section>

            <section id="roomCodeDisplay" class="panel hidden">
                <div class="label">Код комнаты</div>
                <strong id="roomCode">-----</strong>
                <p id="connectionStatus">Ожидание второго игрока...</p>
            </section>
        </div>
    </main>

    <section id="gameContainer" class="hidden" aria-label="Игровая сцена">
        <div id="gameCanvas"></div>

        <div id="hud">
            <span id="playerInfo">Игрок</span>
            <span id="netInfo">offline</span>
            <button id="leaveBtn" title="Выйти">Выйти</button>
        </div>

        <div id="reticle" aria-hidden="true"></div>
        <div id="joystickZone" aria-label="Джойстик движения"></div>
        <div id="mobileControls" aria-label="Мобильное управление">
            <button id="jumpBtn" class="roundBtn" title="Прыжок">Прыг</button>
            <button id="flashlightBtn" class="roundBtn active" title="Фонарик">F</button>
            <button id="fullscreenBtn" class="roundBtn" title="Полный экран">⛶</button>
        </div>
    </section>

    <script src="game.js"></script>
</body>
</html>
